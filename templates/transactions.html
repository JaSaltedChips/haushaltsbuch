{% extends "base.html" %}
{% block title %}Transactions — Expense Monitor{% endblock %}

{% block content %}
<div class="page-header">
  <h1>Transactions</h1>
  <a href="/entry" class="btn btn-primary">+ New Entry</a>
</div>

<div class="section filter-bar">
  <div class="form-row">
    <label>From
      <input type="date" id="f-from">
    </label>
    <label>To
      <input type="date" id="f-to">
    </label>
    <label>Type
      <select id="f-type">
        <option value="">All Types</option>
        <option value="EXPENSE">Expense</option>
        <option value="INCOME">Income</option>
        <option value="TRANSFER">Transfer</option>
      </select>
    </label>
    <label>Account
      <select id="f-account">
        <option value="">All Accounts</option>
        {% for acc in accounts %}
        <option value="{{ acc.id }}">{{ acc.label }}</option>
        {% endfor %}
      </select>
    </label>
    <label>Category
      <select id="f-category">
        <option value="">All Categories</option>
        <optgroup label="Expense">
          {% for cat in expense_cats %}<option value="{{ cat.id }}">{{ cat.name }}</option>{% endfor %}
        </optgroup>
        <optgroup label="Income">
          {% for cat in income_cats %}<option value="{{ cat.id }}">{{ cat.name }}</option>{% endfor %}
        </optgroup>
      </select>
    </label>
    <label>Search
      <input type="text" id="f-search" placeholder="description, account…">
    </label>
    <button class="btn btn-primary" onclick="loadTransactions()">Filter</button>
    <button class="btn" onclick="clearFilters()">Clear</button>
  </div>
</div>

<div class="section">
  <div id="tx-summary" class="text-muted small" style="margin-bottom:0.5rem"></div>
  <div class="table-wrapper">
    <table class="data-table" id="tx-table">
      <thead>
        <tr>
          <th>Date</th>
          <th>Type</th>
          <th>Amount</th>
          <th>From</th>
          <th>To</th>
          <th>Category</th>
          <th>Description</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="tx-body">
        <tr><td colspan="8" class="text-muted">Loading…</td></tr>
      </tbody>
    </table>
  </div>
  <div id="tx-load-more" class="hidden" style="margin-top:1rem;text-align:center">
    <button class="btn" onclick="loadMore()">Load More</button>
  </div>
</div>

<!-- Edit Transaction Modal -->
<div class="modal-backdrop hidden" id="edit-modal">
  <div class="modal">
    <div class="modal-header">
      <h3>Edit Transaction</h3>
      <button class="modal-close" onclick="closeModal('edit-modal')">×</button>
    </div>
    <form onsubmit="saveEdit(event)">
      <input type="hidden" id="edit-id">
      <div class="form-grid">
        <div class="form-group">
          <label>Date <input type="date" id="edit-date" required></label>
        </div>
        <div class="form-group">
          <label>Type <input type="text" id="edit-type" readonly class="readonly-field"></label>
        </div>
        <div class="form-group">
          <label>Amount (EUR) <input type="number" id="edit-amount" step="0.01" min="0.01" required></label>
        </div>
      </div>
      <div class="form-group">
        <label>From Account
          <select id="edit-from">
            <option value="">— None —</option>
            {% for acc in accounts %}
            <option value="{{ acc.id }}">{{ acc.label }}</option>
            {% endfor %}
          </select>
        </label>
      </div>
      <div class="form-group">
        <label>To Account
          <select id="edit-to">
            <option value="">— None —</option>
            {% for acc in accounts %}
            <option value="{{ acc.id }}">{{ acc.label }}</option>
            {% endfor %}
          </select>
        </label>
      </div>
      <div class="form-group">
        <label>Category
          <select id="edit-category">
            <option value="">— None —</option>
            <optgroup label="Expense">
              {% for cat in expense_cats %}<option value="{{ cat.id }}">{{ cat.name }}</option>{% endfor %}
            </optgroup>
            <optgroup label="Income">
              {% for cat in income_cats %}<option value="{{ cat.id }}">{{ cat.name }}</option>{% endfor %}
            </optgroup>
          </select>
        </label>
      </div>
      <div class="form-group">
        <label>Description <input type="text" id="edit-desc" maxlength="200"></label>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn" onclick="closeModal('edit-modal')">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let _offset = 0;
const LIMIT = 100;

function buildParams() {
  const p = new URLSearchParams();
  const from = document.getElementById('f-from').value;
  const to = document.getElementById('f-to').value;
  const type = document.getElementById('f-type').value;
  const account = document.getElementById('f-account').value;
  const cat = document.getElementById('f-category').value;
  const search = document.getElementById('f-search').value.trim();
  if (from) p.set('date_from', from);
  if (to) p.set('date_to', to);
  if (type) p.set('transaction_type', type);
  if (account) p.set('account_id', account);
  if (cat) p.set('category_id', cat);
  if (search) p.set('search', search);
  p.set('limit', LIMIT);
  p.set('offset', _offset);
  return p;
}

async function loadTransactions(append = false) {
  if (!append) { _offset = 0; }
  const r = await fetch('/api/transactions?' + buildParams());
  const txns = await r.json();
  const tbody = document.getElementById('tx-body');
  if (!append) tbody.innerHTML = '';

  if (txns.length === 0 && !append) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-muted empty-state">No transactions found.</td></tr>';
    document.getElementById('tx-summary').textContent = '';
    document.getElementById('tx-load-more').classList.add('hidden');
    return;
  }

  txns.forEach(t => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${t.date}</td>
      <td><span class="badge badge-${t.transaction_type.toLowerCase()}">${t.transaction_type}</span></td>
      <td class="amount">€${(t.amount_cents/100).toFixed(2)}</td>
      <td>${t.from_account_label || '—'}</td>
      <td>${t.to_account_label || '—'}</td>
      <td>${t.category_name || '—'}</td>
      <td>${escHtml(t.description) || '—'}</td>
      <td class="actions">
        <button class="btn btn-sm" onclick='openEditModal(${JSON.stringify(t)})'>Edit</button>
        <button class="btn btn-sm btn-danger" onclick="deleteTx(${t.id})">Delete</button>
      </td>`;
    tbody.appendChild(tr);
  });

  _offset += txns.length;
  document.getElementById('tx-load-more').classList.toggle('hidden', txns.length < LIMIT);
  if (_offset > 0) document.getElementById('tx-summary').textContent = `Showing ${_offset} transaction(s)`;
}

function loadMore() { loadTransactions(true); }

function clearFilters() {
  ['f-from','f-to','f-search'].forEach(id => document.getElementById(id).value = '');
  ['f-type','f-account','f-category'].forEach(id => document.getElementById(id).selectedIndex = 0);
  loadTransactions();
}

function openEditModal(t) {
  document.getElementById('edit-id').value = t.id;
  document.getElementById('edit-date').value = t.date;
  document.getElementById('edit-type').value = t.transaction_type;
  document.getElementById('edit-amount').value = (t.amount_cents / 100).toFixed(2);
  setSelectValue('edit-from', t.from_account_id);
  setSelectValue('edit-to', t.to_account_id);
  setSelectValue('edit-category', t.category_id);
  document.getElementById('edit-desc').value = t.description || '';
  openModal('edit-modal');
}

function setSelectValue(id, val) {
  const sel = document.getElementById(id);
  sel.value = val ? String(val) : '';
}

async function saveEdit(e) {
  e.preventDefault();
  const id = document.getElementById('edit-id').value;
  const body = {
    date: document.getElementById('edit-date').value,
    amount_cents: Math.round(parseFloat(document.getElementById('edit-amount').value) * 100),
    from_account_id: document.getElementById('edit-from').value ? parseInt(document.getElementById('edit-from').value) : null,
    to_account_id: document.getElementById('edit-to').value ? parseInt(document.getElementById('edit-to').value) : null,
    category_id: document.getElementById('edit-category').value ? parseInt(document.getElementById('edit-category').value) : null,
    description: document.getElementById('edit-desc').value.trim(),
  };
  const r = await fetch(`/api/transactions/${id}`, {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
  if (r.ok) { closeModal('edit-modal'); loadTransactions(); showToast('Transaction updated', 'success'); }
  else { const d = await r.json(); showToast(d.detail || 'Error', 'error'); }
}

async function deleteTx(id) {
  if (!confirm('Delete this transaction? This cannot be undone.')) return;
  const r = await fetch(`/api/transactions/${id}`, {method:'DELETE'});
  if (r.ok) { loadTransactions(); showToast('Deleted', 'success'); }
  else showToast('Error deleting', 'error');
}

function escHtml(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// Apply URL params if present
const urlp = new URLSearchParams(location.search);
if (urlp.get('date_from')) document.getElementById('f-from').value = urlp.get('date_from');
if (urlp.get('date_to')) document.getElementById('f-to').value = urlp.get('date_to');

loadTransactions();

// Search on enter
document.getElementById('f-search').addEventListener('keydown', e => { if (e.key==='Enter') loadTransactions(); });
</script>
{% endblock %}
